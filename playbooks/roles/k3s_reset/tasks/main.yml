---
- name: Disable services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  failed_when: false
  with_items:
    - k3s
    - k3s-node
    - k3s-init

- name: Check for running containerd-shim processes
  ansible.builtin.command: pgrep -f "k3s/data/.*/bin/containerd-shim"
  register: containerd_shim_pids
  failed_when: false
  changed_when: false

- name: Kill containerd-shim processes
  ansible.builtin.command: pkill -f "k3s/data/.*/bin/containerd-shim"
  when: containerd_shim_pids.rc == 0
  changed_when: true
  failed_when: false

- name: Umount k3s filesystems
  ansible.builtin.include_tasks: umount_with_children.yml
  with_items:
    - /run/k3s
    - /var/lib/kubelet
    - /run/netns
    - /var/lib/rancher/k3s
  loop_control:
    loop_var: mounted_fs

- name: Remove service files, binaries and data
  ansible.builtin.file:
    name: "{{ item }}"
    state: absent
  with_items:
    - /usr/local/bin/k3s
    - "{{ systemd_dir }}/k3s.service"
    - "{{ systemd_dir }}/k3s-node.service"
    - /etc/rancher/k3s
    - /var/lib/kubelet
    - /var/lib/rancher/k3s

- name: Daemon_reload
  ansible.builtin.systemd:
    daemon_reload: true
