---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: baseline-debian-12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../..
verifier:
  name: ansible
